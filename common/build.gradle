architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
}

tasks.register('runConfigTests', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free WorldGen Editor config and island mask checks.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.wodichka.worldgen_editor.config.IslandConfigLoaderTest'
    dependsOn testClasses
}

check.dependsOn runConfigTests

tasks.register('runStateTests', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.wodichka.worldgen_editor.config.WorldSnapshotStoreTest'
}
check.dependsOn runStateTests

tasks.register('runPaintedTests', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.wodichka.worldgen_editor.config.PaintedMapTest'
}
check.dependsOn runPaintedTests

tasks.register('runPresetTests', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.wodichka.worldgen_editor.config.PresetCatalogTest'
    if(project.hasProperty('projectPreset'))args project.property('projectPreset')
}
check.dependsOn runPresetTests
