plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"


    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.runtimeClasspath
    }
}

loom {
    runs {
        verification {
            server()
            source sourceSets.verification
            runDir 'build/verification-run'
            property 'neoforge.enableGameTest', 'true'
            property 'neoforge.gameTestServer', 'true'
            property 'neoforge.enabledGameTestNamespaces', 'worldgen_editor'
            property 'wge.verification', 'true'
            environmentVariable 'MOD_CLASSES', (sourceSets.main.output + sourceSets.verification.output).files.collect { 'main%%' + it.absolutePath }.join(File.pathSeparator)
        }
    }
}
tasks.named('runVerification').configure { dependsOn verificationClasses }

// Isolated ocean regression worlds. Test-only seed mixin is never included in the mod jar.
if (project.hasProperty('oceanVerification')) {
    def climate=project.property('oceanVerification').toString()
    if(!(climate in ['default','temperate','cold','warm']))throw new GradleException('Invalid oceanVerification climate')
    def runName=project.findProperty('oceanRun')?.toString() ?: climate
    if(!(runName ==~ /[a-z0-9_-]+/))throw new GradleException('Invalid oceanRun name')
    def testDir="build/ocean-verification/$runName"
    loom.runs.verification.runDir testDir
    loom.runs.verification.property 'wge.oceanVerification','true'
    loom.runs.verification.property 'wge.oceanClimate',climate
    loom.runs.verification.programArg '--mixin.config'
    loom.runs.verification.programArg 'wge-verification.mixins.json'
    tasks.named('processVerificationResources').configure {
        inputs.property 'oceanVerification',climate
        filesMatching('data/minecraft/worldgen/world_preset/flat.json') {
            filter { line -> line.replace('"generation_version": 2','"generation_version": 3').replace('"worldgen_editor:island_overworld"','"minecraft:overworld"') }
        }
    }
    tasks.named('runVerification').configure {
        doFirst {
            if(project.hasProperty('oceanReopen')) {
                if(!file("$testDir/world/worldgen_editor/worldgen_editor.json").isFile())throw new GradleException('No pinned ocean verification world to reopen')
                return
            }
            def presetDir=file("$testDir/config/worldgen_editor/presets");presetDir.mkdirs()
            def config=new groovy.json.JsonSlurper().parse(rootProject.file(project.findProperty('oceanPreset') ?: 'common/src/test/resources/painted-islands.json'))
            if(climate=='default')config.remove('ocean_temperature');else config.ocean_temperature=climate
            new File(presetDir,'default.json').text=groovy.json.JsonOutput.toJson(config)
        }
    }
}

loom.runs {
    presetClient {
        client()
        source sourceSets.main
        runDir 'build/preset-client-run'
        vmArg '-Xmx2G'
    }
}

if (project.hasProperty('withTerraBlender')) {
    dependencies { modRuntimeOnly files('build/verification-libs/TerraBlender-neoforge-1.21.1-4.1.0.8.jar') }
    sourceSets.verification.java.srcDir 'src/terrablenderVerification/java'
    sourceSets.verification.compileClasspath += files('build/verification-libs/TerraBlender-neoforge-1.21.1-4.1.0.8.jar')
    loom.runs.verification.property 'wge.terrablenderVerification', 'true'
    loom.runs.verification.runDir 'build/terrablender-verification-run'
}

if (project.hasProperty('compatProfile')) {
    def profiles = [
        vanilla: [], painted: [], disabled: [],
        terrablender: ['terrablender'],
        bop: ['biomes-o-plenty','glitchcore','terrablender'],
        terralith: ['terralith','lithostitched','apollib'],
        tectonic: ['tectonic','lithostitched','apollib'],
        terratonic: ['terralith','tectonic','lithostitched','apollib'],
        bop_terralith: ['biomes-o-plenty','glitchcore','terrablender','terralith','lithostitched','apollib'],
        bop_tectonic: ['biomes-o-plenty','glitchcore','terrablender','tectonic','lithostitched','apollib'],
        combined: ['biomes-o-plenty','glitchcore','terrablender','terralith','tectonic','lithostitched','apollib']
    ]
    def profile=project.property('compatProfile').toString()
    if(!profiles.containsKey(profile))throw new GradleException("Unknown compatibility profile: $profile")
    def lock=new groovy.json.JsonSlurper().parse(rootProject.file('tools/compatibility-lock.json'))
    dependencies {
        if(profiles[profile].contains('apollib'))modRuntimeOnly files('build/compatibility-libs/json5-java-3.0.0-gamelibrary.jar')
        profiles[profile].each { name ->
            def artifact=lock.find { it.project==name }
            if(artifact==null)throw new GradleException("Missing compatibility lock for $name")
            modRuntimeOnly files("build/compatibility-libs/${artifact.filename}")
        }
    }
    sourceSets.verification.java.srcDir 'src/compatibilityVerification/java'
    loom.runs.verification.property 'wge.compatibilityVerification','true'
    loom.runs.verification.property 'wge.compatProfile',profile
    loom.runs.verification.runDir "build/compatibility-runs/$profile-v3"
    tasks.named('processVerificationResources').configure {
        inputs.property 'compatibilityProfile',profile
        filesMatching('data/minecraft/worldgen/world_preset/flat.json') {
            filter { line -> line.replace('"generation_version": 2','"generation_version": 3').replace('"worldgen_editor:island_overworld"','"minecraft:overworld"') }
        }
    }
    tasks.named('runVerification').configure {
        doFirst {
            def dir=file("build/compatibility-runs/$profile-v3/config/worldgen_editor/presets")
            dir.mkdirs()
            def config=[enabled:true,outer_ocean:'minecraft:deep_ocean',entries:[[name:'Verification',x:0,z:0,radius:6000,temperature:'standard']]]
            if(profile=='painted')config=new groovy.json.JsonSlurper().parse(rootProject.file('common/src/test/resources/painted-islands.json'))
            if(profile=='disabled')config.enabled=false
            new File(dir,'default.json').text=groovy.json.JsonOutput.toJson(config)
        }
    }
}
